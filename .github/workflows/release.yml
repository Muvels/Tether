name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact_name: tether-macos
            build_args: --mac --universal
          - name: Linux
            os: ubuntu-latest
            artifact_name: tether-linux
            build_args: --linux AppImage
          - name: Windows
            os: windows-latest
            artifact_name: tether-windows
            build_args: --win nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MAINTAINANCE_GITHUB_TOKEN }}
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${APPLE_SIGNING_CERTIFICATE}" ]]; then
            export CSC_LINK="${APPLE_SIGNING_CERTIFICATE}"
          fi

          if [[ -n "${APPLE_SIGNING_CERTIFICATE_PASSWORD}" ]]; then
            export CSC_KEY_PASSWORD="${APPLE_SIGNING_CERTIFICATE_PASSWORD}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            pnpm run build
            pnpm exec electron-builder --publish always ${{ matrix.build_args }}
          else
            pnpm run build
            pnpm exec electron-builder --publish never ${{ matrix.build_args }}
          fi

      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/**
          if-no-files-found: error
